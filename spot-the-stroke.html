    document.documentElement.setAttribute('data-theme', t);

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* ==================================================================
   DESIGN TOKENS: the main site's palette, plus three game colours.
   Red (--signal) is kept for one meaning only: call 108.
   ================================================================== */
:root{
  --ink:#14302a; --ink-soft:#4b615c; --ink-faint:#5f7570;
  --accent:#2f7d6f; --accent-strong:#1f5b50; --accent-ink:#1b5449;
  --accent-soft:#eaf4f1; --accent-line:#bcdcd3; --gold:#8c611f;
  --bg:#f5faf8; --surface:#ffffff; --surface-2:#ffffff;
  --line:#dce8e4; --line-soft:#e8f0ed;
  --btn-ink:#ffffff;
  --shadow-sm:0 1px 2px rgba(20,48,42,.05);
  --shadow-md:0 10px 30px rgba(20,48,42,.08);
  --quiet:#eef3f1;
  --panel:#14302a; --panel-ink:#ffffff; --panel-soft:#c7d8d3;
  --panel-btn:#ffffff; --panel-btn-ink:#14302a;
  --footer-bg:#14302a; --footer-ink:#c7d8d3;
  --signal:#B8102C; --signal-ink:#8E0B21;
  --danger-bg:#fdf1f0; --danger-line:#f3d5d1;
  --wa:#075E54;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --deva:"Noto Sans Devanagari",Inter,"Nirmala UI",Mangal,sans-serif;
}
[data-theme="dark"]{
  --ink:#f1f7f5; --ink-soft:#c2d3cd; --ink-faint:#97aca6;
  --accent:#5cc0aa; --accent-strong:#8adcc8; --accent-ink:#8adcc8;
  --accent-soft:#17322c; --accent-line:#33594f; --gold:#e2b66d;
  --bg:#101c1a; --surface:#1b2c28; --surface-2:#213430;
  --line:#2f443d; --line-soft:#253833;
  --btn-ink:#04100d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 10px 30px rgba(0,0,0,.45);
  --quiet:#16231f;
  --panel:#213430; --panel-ink:#f1f7f5; --panel-soft:#c2d3cd;
  --panel-btn:#5cc0aa; --panel-btn-ink:#04100d;
  --footer-bg:#0b1614; --footer-ink:#c2d3cd;
  --danger-bg:#2a1613; --danger-line:#4a251f;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme]){
    --ink:#f1f7f5; --ink-soft:#c2d3cd; --ink-faint:#97aca6;
    --accent:#5cc0aa; --accent-strong:#8adcc8; --accent-ink:#8adcc8;
    --accent-soft:#17322c; --accent-line:#33594f; --gold:#e2b66d;
    --bg:#101c1a; --surface:#1b2c28; --surface-2:#213430;
    --line:#2f443d; --line-soft:#253833; --btn-ink:#04100d;
    --quiet:#16231f; --panel:#213430; --panel-ink:#f1f7f5; --panel-soft:#c2d3cd;
    --panel-btn:#5cc0aa; --panel-btn-ink:#04100d; --footer-bg:#0b1614; --footer-ink:#c2d3cd;
    --danger-bg:#2a1613; --danger-line:#4a251f;
  }
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:16px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
              "Noto Sans Devanagari","Nirmala UI",Mangal,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);line-height:1.65;font-size:17.5px;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;display:flex;flex-direction:column;
  transition:background-color .25s ease,color .25s ease;
}
[data-theme="dark"] body{-webkit-font-smoothing:auto;-moz-osx-font-smoothing:auto}
body.mr{line-height:1.85}
a{color:var(--accent-ink)}
h1,h2,h3{font-family:var(--serif);font-weight:600}
body.mr h1,body.mr h2,body.mr h3{font-family:var(--deva);font-weight:600;line-height:1.42}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- EMERGENCY BOX: small, below the content on every screen ---------- */
.sos-wrap{width:100%;max-width:640px;margin:0 auto;padding:0 18px 36px}
.sos-box{
  display:flex;align-items:center;justify-content:space-between;gap:12px 14px;flex-wrap:wrap;
  padding:14px 16px;border-radius:13px;
  background:var(--danger-bg);border:1px solid var(--danger-line);
}
.sos-box__q{font-weight:600;font-size:.95rem;line-height:1.35;color:var(--ink)}
.sos-box__alt{display:block;font-weight:400;font-size:.84rem;color:var(--ink-soft)}
.sos-box__alt a{color:inherit;font-weight:600}
.sos-call{
  flex-shrink:0;display:inline-flex;align-items:center;gap:7px;
  background:var(--signal);color:#fff;text-decoration:none;border-radius:999px;
  padding:9px 18px;font-weight:700;font-size:.95rem;line-height:1.15;
}
.sos-call:hover{background:var(--signal-ink)}
.sos-call svg{width:16px;height:16px}

/* ---------- TOP BAR (same as the site's inner pages) ---------- */
.topbar{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;
}
/* The wordmark, exactly as on the main site's header. It stays in English in both languages. */
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--ink);min-width:0}
.brand .mark{width:40px;height:40px;color:var(--accent);flex-shrink:0}
.bt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.bt b{font-family:var(--serif);font-weight:600;font-size:1.08rem;letter-spacing:.055em;text-transform:uppercase;color:var(--ink-soft)}
.bt span{font-size:.56rem;letter-spacing:.235em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-top:4px}
.tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{
  min-width:40px;height:40px;border-radius:10px;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  display:inline-flex;align-items:center;justify-content:center;font:inherit;
  transition:background-color .18s,border-color .18s,color .18s;
}
.icon-btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.icon-btn svg{width:18px;height:18px}
#langBtn{padding:0 13px;font-size:.85rem;font-weight:600;white-space:nowrap}
.icon-sun{display:none}
.icon-moon{display:block}
[data-theme="dark"] .icon-sun{display:block}
[data-theme="dark"] .icon-moon{display:none}

/* ---------- STAGE ---------- */
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:30px 18px 32px}
.screen.enter{animation:slideIn .32s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.lead{font-size:1.1rem;color:var(--ink-soft);margin-top:14px}
.note{font-size:.9rem;color:var(--ink-faint);margin-top:12px}
.h1{font-size:1.75rem;line-height:1.22;letter-spacing:-.4px}
.h2{font-size:1.2rem;line-height:1.35;margin:30px 0 12px}
body.mr .h1{font-size:1.6rem}
body.mr .h2{font-size:1.15rem}

/* Buttons: the site's pill */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  border:1.5px solid var(--accent);border-radius:999px;padding:15px 28px;min-height:54px;
  font:inherit;font-size:1rem;font-weight:600;line-height:1.2;text-align:center;
  background:var(--accent);color:var(--btn-ink);text-decoration:none;cursor:pointer;
  transition:background-color .18s,border-color .18s,transform .18s,box-shadow .18s;
}
.btn:hover{background:var(--accent-strong);border-color:var(--accent-strong);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-ghost{background:transparent;color:var(--accent-ink);border-color:var(--accent-line)}
.btn-ghost:hover{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.btn-wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn-wa:hover{background:#054d45;border-color:#054d45}
.btn-block{width:100%}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.actions .btn{flex:1 1 220px}
.textlink{
  background:none;border:none;padding:8px 0;min-height:40px;font:inherit;font-size:.92rem;
  color:var(--ink-faint);cursor:pointer;text-decoration:none;
}
.textlink:hover{color:var(--accent-ink)}

/* ---------- INTRO ---------- */
.intro__title{font-size:clamp(2.6rem,11vw,4.1rem);line-height:1.04;letter-spacing:-1px;margin-bottom:22px}
body.mr .intro__title{font-size:clamp(2.3rem,10vw,3.5rem);line-height:1.3;letter-spacing:0}

.byline{
  display:flex;align-items:center;gap:12px;margin-top:30px;padding-top:20px;
  border-top:1px solid var(--line);font-size:.9rem;color:var(--ink-soft);line-height:1.45;
}
.byline b{color:var(--ink);font-weight:600}
.face{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex-shrink:0;background:var(--accent-soft)}

/* ---------- THE BE FAST STRIP ---------- */
.strip{list-style:none;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  aspect-ratio:4/5;padding:4px 2px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink-faint);
}
.tile__l{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,9.5vw,3.2rem);line-height:1}
.tile__w{font-size:clamp(.66rem,2.5vw,.82rem);font-weight:600;line-height:1.15;margin-top:5px;max-width:100%;overflow-wrap:anywhere;text-align:center}
.tile.is-on{background:var(--accent);border-color:var(--accent);color:var(--btn-ink)}
.tile--t.is-on{background:var(--signal);border-color:var(--signal);color:#fff}
.strip--sm{gap:6px;margin:4px 0 22px}
.strip--sm .tile{aspect-ratio:1;border-radius:10px}
.strip--sm .tile:not(.is-on){border-style:dashed;border-color:var(--accent-line)}
.strip--sm .tile__l{font-size:clamp(1.25rem,5.5vw,1.65rem)}
.strip--sm .tile__w{display:none}
.strip.is-animate .tile{animation:tileOn .45s ease-out both;animation-delay:calc(.3s + var(--i) * .16s)}
.strip.is-animate .tile--t{animation-name:tileOnT}
@keyframes tileOn{from{background:var(--surface);border-color:var(--line);color:var(--ink-faint)}}
@keyframes tileOnT{from{background:var(--surface);border-color:var(--line);color:var(--ink-faint)}}
.tile.is-fresh{animation:pop .5s ease-out}
@keyframes pop{45%{transform:scale(1.16)}}

/* ---------- GAME ---------- */
.progress-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-faint);margin-bottom:7px;letter-spacing:.02em}
.progress-track{height:5px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .35s cubic-bezier(.4,0,.2,1)}
.story{margin-top:10px;color:var(--ink-soft)}

/* Option rows: the site's feedback-form "choice" */
.opts{list-style:none;display:flex;flex-direction:column;gap:11px}
.opt{
  display:flex;align-items:flex-start;gap:15px;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:13px;
  padding:15px 18px;min-height:56px;font:inherit;font-size:1rem;text-align:left;color:var(--ink);
  cursor:pointer;transition:.16s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.key{
  width:27px;height:27px;flex-shrink:0;margin-top:1px;border-radius:8px;
  background:var(--bg);border:1px solid var(--line);color:var(--btn-ink);
  display:flex;align-items:center;justify-content:center;
}
.opt--radio .key{border-radius:50%}
.key svg{width:16px;height:16px}
.opt__body{display:block}
.opt__text{display:block}
.opt__tag{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:6px;font-size:.86rem;font-weight:600}

.opt.is-picked{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt.is-picked .key{background:var(--accent);border-color:var(--accent)}
.opt.is-hit{border-color:var(--accent);background:var(--accent-soft)}
.opt.is-hit .key{background:var(--accent);border-color:var(--accent)}
.opt.is-hit .opt__tag{color:var(--accent-ink)}
.opt.is-miss{border-style:dashed;border-color:var(--gold)}
.opt.is-miss .key{border-style:dashed;border-color:var(--gold);background:transparent}
.opt.is-miss .opt__tag{color:var(--gold)}
.opt.is-false{background:var(--quiet);border-color:var(--quiet);color:var(--ink-soft)}
.opt.is-false .key{background:var(--ink-faint);border-color:var(--ink-faint);color:var(--bg)}
.opt.is-quiet{color:var(--ink-faint)}

.badge{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.badge__l{
  display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;border-radius:6px;
  background:var(--accent);color:var(--btn-ink);font-family:var(--serif);font-weight:600;font-size:.95rem;line-height:1;
}
.spot{margin-top:22px;font-weight:700;font-size:1.05rem}
.spot:focus-visible{outline-offset:6px}

.feedback{margin-top:20px;padding:22px;border-radius:16px;background:var(--panel);color:var(--panel-ink);box-shadow:var(--shadow-md)}
[data-theme="dark"] .feedback{border:1px solid var(--accent-line)}
.feedback__h{font-size:1.55rem;line-height:1.2}
.feedback p{margin:8px 0 18px;color:var(--panel-soft)}
.feedback .btn{width:100%;background:var(--panel-btn);border-color:var(--panel-btn);color:var(--panel-btn-ink)}
.feedback .btn:hover{opacity:.92;box-shadow:none}
.feedback__h:focus-visible,.feedback .btn:focus-visible{outline-color:var(--panel-ink)}

/* ---------- SIGN LIST (learn + recap) ---------- */
.signs{list-style:none;margin-top:18px}
.sign{display:grid;grid-template-columns:48px 1fr;gap:15px;align-items:start;padding:15px 0;border-top:1px solid var(--line)}
.sign:last-child{border-bottom:1px solid var(--line)}
.sign__l{
  display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;
  background:var(--accent-soft);border:1.5px solid var(--accent-line);color:var(--accent-ink);
  font-family:var(--serif);font-weight:600;font-size:1.65rem;line-height:1;
}
.sign__l--t{background:var(--signal);border-color:var(--signal);color:#fff}
.sign__h{font-family:Inter,sans-serif;font-size:1.05rem;font-weight:700;line-height:1.35}
body.mr .sign__h{font-family:var(--deva)}
.sign__en{font-weight:500;color:var(--ink-faint);font-size:.88rem;margin-left:6px;font-family:Inter,sans-serif}
.sign p{color:var(--ink-soft);margin-top:2px}
.other{
  margin:20px 0 24px;padding:15px 18px;border-radius:13px;font-size:.95rem;
  background:var(--surface);border:1px dashed var(--accent-line);color:var(--ink-soft);
}
.other b{color:var(--ink)}

/* ---------- RESULTS ---------- */
.res__title{font-size:clamp(2.1rem,8.5vw,3rem);line-height:1.12;letter-spacing:-.6px}
body.mr .res__title{font-size:clamp(1.8rem,7.5vw,2.5rem);letter-spacing:0;line-height:1.38}
.res__line{font-size:1.1rem;font-weight:600;margin-top:14px}
.res__sub{color:var(--ink-soft);margin:4px 0 18px}
.wait{list-style:none}
.wait li{position:relative;padding:4px 0 4px 20px;color:var(--ink-soft)}
.wait li::before{content:"";position:absolute;left:2px;top:.9em;width:7px;height:7px;border-radius:50%;background:var(--signal)}

/* The one clinic mention at the end: quiet, personal, one link */
.care{
  display:flex;gap:16px;align-items:flex-start;margin-top:40px;padding:20px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);
}
.care .face{width:56px;height:56px}
.care h2{font-size:1.1rem;line-height:1.35;margin:0 0 6px}
body.mr .care h2{font-size:1.05rem}
.care p{color:var(--ink-soft);font-size:.95rem}
.care a{display:inline-block;margin-top:10px;font-weight:600;font-size:.95rem;color:var(--accent-ink);text-underline-offset:3px}

/* ---------- FOOTER (the site's footer, slimmed) ---------- */
footer.site{background:var(--footer-bg);color:var(--footer-ink);font-size:.84rem;line-height:1.6}
.foot__in{max-width:640px;margin:0 auto;padding:26px 18px 30px}
.foot__brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;color:#fff;text-decoration:none}
[data-theme="dark"] .foot__brand{color:var(--ink)}
.foot__brand svg{width:32px;height:32px;color:#5cc0aa;flex-shrink:0}
.foot__brand .bt b{color:inherit;font-size:1rem}
.foot__brand .bt span{color:var(--footer-ink)}
.foot__copy{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.foot__in p + p{margin-top:6px}
footer.site a{color:inherit}

@media (min-width:720px){
  main{padding-top:44px}
  .strip{gap:10px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" id="brandLink" href="https://trajectory-neurorehab.github.io/" aria-label="Trajectory Neurorehabilitation, home">
    <svg class="mark" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="33.9" cy="14.9" r="8.8" stroke="currentColor" stroke-width="1.5" opacity=".3"/>
      <path d="M7.9 39.4C15.4 39.4 24.9 34.9 33.9 14.9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="7.9" cy="39.4" r="2.5" fill="currentColor" opacity=".55"/>
      <circle cx="20.3" cy="34.6" r="3.1" fill="currentColor" opacity=".8"/>
      <circle cx="33.9" cy="14.9" r="5.2" fill="currentColor"/>
    </svg>
    <span class="bt">
      <b>Trajectory</b>
      <span>Neurorehabilitation</span>
    </span>
  </a>
  <div class="tools">

      why: {
        en: "Never wait for morning. If you don't know when the signs started, tell the ambulance team when he was last seen well, like when he went to bed. Oil massage won't help, and it costs precious time.",

  ];

  var TOTAL_SIGNS = SCENES.reduce(function(n, s){ return n + s.obs.filter(function(o){ return o.sign; }).length; }, 0);

  var ICON = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cross: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
    wa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.6-5A8.4 8.4 0 1 1 21 11.6Z"/></svg>'
  };

  /* ------------------------------------------------------------------
     STATE
     ------------------------------------------------------------------ */
  function store(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function read(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  function initialLang(){
    try{
      var p = new URLSearchParams(location.search).get('lang');
      if (p === 'en' || p === 'mr') return p;
    }catch(e){}
    var saved = read('trj_lang');                 /* shared with the main site */
    if (saved === 'en' || saved === 'mr') return saved;
    if ((navigator.language || '').toLowerCase().indexOf('mr') === 0) return 'mr';
    return 'en';
  }

  var state = {
    lang: initialLang(),
    screen: 'intro',
    round: 0,
    picked: {},
    checked: false,
    action: null,
    found: 0,
    rightCalls: 0,
    collected: {},
    fresh: {},
    animateIntro: true,
    enter: true          /* slide the screen in only when it changes, not on every tap */
  };

  function resetGame(){
    state.round = 0; state.picked = {}; state.checked = false; state.action = null;
    state.found = 0; state.rightCalls = 0; state.collected = {}; state.fresh = {};
  }

  /* ------------------------------------------------------------------
     HELPERS
     ------------------------------------------------------------------ */
  var DEVA = '०१२३४५६७८९';
  function t(key){ return T[state.lang][key]; }
  function L(obj){ return obj[state.lang]; }
  function num(n){ return state.lang === 'mr' ? String(n).replace(/[0-9]/g, function(d){ return DEVA[d]; }) : String(n); }
  function fmt(s, vars){ return s.replace(/\{(\w+)\}/g, function(_, k){ return num(vars[k]); }); }
  function word(k){ return LETTERS[state.lang][k][0]; }
  function attr(s){ return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

  function gameUrl(){
    var base = /^https?:$/.test(location.protocol) ? location.href.split('#')[0] : CONFIG.siteUrl + CONFIG.gameFile;
    try{
      var u = new URL(base);
      u.searchParams.set('lang', state.lang);
      return u.toString();
    }catch(e){ return base; }
  }

  function face(cls){
    return '<img class="face' + (cls ? ' ' + cls : '') + '" src="' + attr(PHOTO) + '" alt="" width="56" height="56" loading="lazy" onerror="this.remove()">';
  }

  /* ------------------------------------------------------------------
     PIECES
     ------------------------------------------------------------------ */
  function strip(size, mode, animate){
    var items = ORDER.map(function(k, i){
      var on = mode === 'all' || !!state.collected[k];
      var status = mode === 'collect' ? ', ' + (on ? t('stripGot') : t('stripNot')) : '';
      var cls = 'tile' + (k === 'T' ? ' tile--t' : '') + (on ? ' is-on' : '') + (state.fresh[k] ? ' is-fresh' : '');
      return '<li class="' + cls + '" style="--i:' + i + '">' +
        '<span class="tile__l" aria-hidden="true">' + k + '</span>' +
        '<span class="tile__w" aria-hidden="true">' + word(k) + '</span>' +
        '<span class="sr">' + k + ', ' + word(k) + status + '</span></li>';
    }).join('');
    var label = mode === 'collect' ? t('stripCollectLabel') : t('stripLabel');
    return '<ol class="strip strip--' + size + (animate ? ' is-animate' : '') + '" aria-label="' + attr(label) + '">' + items + '</ol>';
  }

  function badge(k){
    return '<span class="badge"><span class="badge__l" aria-hidden="true">' + k + '</span><span>' + word(k) + '</span></span>';
  }

  function signList(level){
    var items = ORDER.map(function(k){
      var w = LETTERS[state.lang][k][0], text = LETTERS[state.lang][k][1];
      var en = state.lang === 'mr' ? '<span class="sign__en" lang="en">' + LETTERS.en[k][0] + '</span>' : '';
      return '<li class="sign">' +
        '<span class="sign__l' + (k === 'T' ? ' sign__l--t' : '') + '" aria-hidden="true">' + k + '</span>' +
        '<div><h' + level + ' class="sign__h"><span class="sr">' + k + ': </span>' + w + en + '</h' + level + '><p>' + text + '</p></div></li>';
    }).join('');
    return '<ol class="signs">' + items + '</ol>';
  }

  function obsItem(o, i){
    var picked = !!state.picked[i], cls = '', icon = '', tag = '';
    if (!state.checked){
      if (picked){ cls = 'is-picked'; icon = ICON.check; }
    } else if (o.sign && picked){
      cls = 'is-hit'; icon = ICON.check; tag = '<span>' + t('tagHit') + '</span>' + badge(o.sign);
    } else if (o.sign){
      cls = 'is-miss'; tag = '<span>' + t('tagMiss') + '</span>' + badge(o.sign);
    } else if (picked){
      cls = 'is-false'; icon = ICON.cross; tag = '<span>' + t('tagFalse') + '</span>';
    } else {
      cls = 'is-quiet';
    }
    return '<li><button type="button" class="opt ' + cls + '" data-act="pick" data-i="' + i + '" aria-pressed="' + picked + '"' + (state.checked ? ' disabled' : '') + '>' +
      '<span class="key" aria-hidden="true">' + icon + '</span>' +
      '<span class="opt__body"><span class="opt__text">' + L(o) + '</span>' + (tag ? '<span class="opt__tag">' + tag + '</span>' : '') + '</span>' +
      '</button></li>';
  }

  function actItem(a, i){
    var answered = state.action !== null, chosen = state.action === i, cls = '', icon = '', tag = '';
    if (answered){
      if (a.ok){ cls = 'is-hit'; icon = ICON.check; tag = chosen ? t('tagYours') : t('tagRight'); }
      else if (chosen){ cls = 'is-false'; icon = ICON.cross; tag = t('tagYours'); }
      else { cls = 'is-quiet'; }
    }
    return '<li><button type="button" class="opt opt--radio ' + cls + '" data-act="act" data-i="' + i + '"' + (answered ? ' disabled' : '') + '>' +
      '<span class="key" aria-hidden="true">' + icon + '</span>' +
      '<span class="opt__body"><span class="opt__text">' + L(a) + '</span>' + (tag ? '<span class="opt__tag"><span>' + tag + '</span></span>' : '') + '</span>' +
      '</button></li>';
  }

  function feedback(sc){
    var ok = sc.acts[state.action].ok, last = state.round === SCENES.length - 1;
    return '<div class="feedback">' +
      '<h2 class="feedback__h" id="fb" tabindex="-1">' + (ok ? t('right') : t('wrong')) + '</h2>' +
      '<p>' + L(sc.why) + '</p>' +
      '<button class="btn" type="button" data-act="next">' + (last ? t('finish') : t('next')) + '</button></div>';
  }

  /* ------------------------------------------------------------------
     SCREENS
     ------------------------------------------------------------------ */
  var screens = {
    intro: function(){
      return '<section class="screen" aria-labelledby="h-intro">' +
        '<h1 class="intro__title" id="h-intro" tabindex="-1">' + t('introTitle') + '</h1>' +
        strip('lg', 'all', state.animateIntro) +
        '<p class="lead">' + t('introLead') + '</p>' +
        '<div class="actions">' +
          '<button class="btn" type="button" data-act="start">' + t('start') + '</button>' +
          '<button class="btn btn-ghost" type="button" data-act="learn">' + t('learnFirst') + '</button>' +
        '</div>' +
        '<p class="note">' + t('introTime') + '</p>' +
        '<p class="byline">' + face() + '<span>' + t('byline') + '</span></p>' +
      '</section>';
    },

    learn: function(){
      return '<section class="screen" aria-labelledby="h-learn">' +
        '<button class="textlink" type="button" data-act="home">&larr; ' + t('back') + '</button>' +
        '<h1 class="h1" id="h-learn" tabindex="-1">' + t('learnTitle') + '</h1>' +
        '<p class="lead">' + t('learnIntro') + '</p>' +
        signList(2) +
        '<p class="other"><b>' + t('otherTitle') + '</b> ' + t('otherText') + '</p>' +
        '<button class="btn btn-block" type="button" data-act="start">' + t('start') + '</button>' +
      '</section>';
    },

    game: function(){
      var sc = SCENES[state.round], after = '';
      if (state.checked){
        var signs = sc.obs.filter(function(o){ return o.sign; }).length;
        var hits = sc.obs.filter(function(o, i){ return o.sign && state.picked[i]; }).length;
        after = '<p class="spot" id="spot" tabindex="-1">' + fmt(t('spotted'), { x: hits, y: signs }) + '</p>' +
          '<h2 class="h2" id="h-act">' + t('actionQ') + '</h2>' +
          '<ul class="opts" aria-labelledby="h-act">' + sc.acts.map(actItem).join('') + '</ul>' +
          (state.action !== null ? feedback(sc) : '');
      }
      var pct = Math.round((state.round + (state.action !== null ? 1 : 0)) / SCENES.length * 100);
      return '<section class="screen" aria-labelledby="h-game">' +
        '<div class="progress-meta"><span>' + fmt(t('roundOf'), { n: state.round + 1, t: SCENES.length }) + '</span><span>BE FAST</span></div>' +
        '<div class="progress-track" aria-hidden="true"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        strip('sm', 'collect', false) +
        '<h1 class="h1" id="h-game" tabindex="-1">' + L(sc.title) + '</h1>' +
        '<p class="story">' + L(sc.story) + '</p>' +
        '<h2 class="h2" id="h-obs">' + t('tapPrompt') + '</h2>' +
        '<ul class="opts" aria-labelledby="h-obs">' + sc.obs.map(obsItem).join('') + '</ul>' +
        (state.checked ? '' : '<button class="btn btn-block" type="button" data-act="check" style="margin-top:20px">' + t('check') + '</button>') +
        after +
      '</section>';
    },

    results: function(){
      var allSigns = state.found === TOTAL_SIGNS, allCalls = state.rightCalls === SCENES.length;
      var title = allSigns && allCalls ? t('resPerfect') : allCalls ? t('resActions') : t('resRetry');
      var sub = allSigns && allCalls ? t('resPerfectSub') : allCalls ? t('resActionsSub') : t('resRetrySub');
      var shareHref = 'https://wa.me/?text=' + encodeURIComponent(t('shareMsg') + ' ' + gameUrl());
      var siteLink = CONFIG.siteUrl + (state.lang === 'mr' ? '?lang=mr' : '') + '#process';
      return '<section class="screen" aria-labelledby="h-res">' +
        '<h1 class="res__title" id="h-res" tabindex="-1">' + title + '</h1>' +
        '<p class="res__line">' + fmt(t('resLine'), { x: state.found, y: TOTAL_SIGNS, a: state.rightCalls, b: SCENES.length }) + '</p>' +
        '<p class="res__sub">' + sub + '</p>' +
        strip('sm', 'collect', false) +
        '<div class="actions">' +
          '<a class="btn btn-wa" href="' + attr(shareHref) + '" target="_blank" rel="noopener">' + ICON.wa + '<span>' + t('share') + '</span></a>' +
          '<button class="btn btn-ghost" type="button" data-act="again">' + t('again') + '</button>' +
        '</div>' +
        '<h2 class="h2">' + t('recapTitle') + '</h2>' +
        signList(3) +
        '<p class="other"><b>' + t('otherTitle') + '</b> ' + t('otherText') + '</p>' +
        '<h2 class="h2">' + t('waitTitle') + '</h2>' +
        '<ul class="wait">' + t('wait').map(function(w){ return '<li>' + w + '</li>'; }).join('') + '</ul>' +
        '<aside class="care" aria-labelledby="h-care">' + face() +
          '<div><h2 id="h-care">' + t('careTitle') + '</h2>' +
          '<p>' + t('careBody') + '</p>' +
          '<a href="' + attr(siteLink) + '">' + t('careLink') + '</a></div>' +
        '</aside>' +
      '</section>';
    }
  };

  /* ------------------------------------------------------------------
     RENDER + EVENTS
     ------------------------------------------------------------------ */
  function $(id){ return document.getElementById(id); }
  var main = $('main'), langBtn = $('langBtn'), themeBtn = $('themeBtn'), root = document.documentElement;

  function setText(id, key){ var el = $(id); if (el) el.textContent = t(key); }

  function render(focusSel){
    root.lang = state.lang;
    document.body.classList.toggle('mr', state.lang === 'mr');
    document.title = t('docTitle');
    setText('sosQ', 'sosQ'); setText('sosAlt', 'sosAlt'); setText('sosCall', 'sosCall');
    setText('disclaimer', 'disclaimer');
    langBtn.textContent = t('langBtn');
    langBtn.setAttribute('lang', state.lang === 'en' ? 'mr' : 'en');
    langBtn.setAttribute('aria-label', t('langAria'));
    var home = CONFIG.siteUrl + (state.lang === 'mr' ? '?lang=mr' : '');
    $('brandLink').href = home; $('footBrand').href = home;
    themeLabel();

    main.innerHTML = screens[state.screen]();
    if (state.enter && main.firstElementChild){ main.firstElementChild.classList.add('enter'); }
    state.enter = false;
    state.fresh = {};
    if (state.screen === 'intro') state.animateIntro = false;
    if (focusSel){ var el = main.querySelector(focusSel); if (el) el.focus(); }
  }

  function go(screen, focusSel){
    state.screen = screen;
    state.enter = true;
    window.scrollTo(0, 0);
    render(focusSel);
  }

  function togglePick(i, el){
    state.picked[i] = !state.picked[i];
    var on = state.picked[i];
    el.classList.toggle('is-picked', on);
    el.setAttribute('aria-pressed', String(on));
    el.querySelector('.key').innerHTML = on ? ICON.check : '';
  }

  function check(){
    var sc = SCENES[state.round];
    state.checked = true;
    sc.obs.forEach(function(o, i){
      if (o.sign && state.picked[i]){
        state.found++;
        if (!state.collected[o.sign]){ state.collected[o.sign] = true; state.fresh[o.sign] = true; }
      }
    });
    render('#spot');
  }

  function answer(i){
    var sc = SCENES[state.round];
    state.action = i;
    if (sc.acts[i].ok){
      state.rightCalls++;
      if (!state.collected.T){ state.collected.T = true; state.fresh.T = true; }
    }
    render('#fb');
  }

  function next(){
    state.round++;
    state.picked = {}; state.checked = false; state.action = null;
    if (state.round >= SCENES.length) go('results', '#h-res');
    else go('game', '#h-game');
  }

  main.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    var i = Number(el.getAttribute('data-i'));
    switch (el.getAttribute('data-act')){
      case 'start':
      case 'again': resetGame(); go('game', '#h-game'); break;
      case 'learn': go('learn', '#h-learn'); break;
      case 'home': go('intro', '#h-intro'); break;
      case 'pick': if (!state.checked) togglePick(i, el); break;
      case 'check': if (!state.checked) check(); break;
      case 'act': if (state.action === null) answer(i); break;
      case 'next': next(); break;
    }
  });

  langBtn.addEventListener('click', function(){
    state.lang = state.lang === 'en' ? 'mr' : 'en';
    store('trj_lang', state.lang);                 /* the main site follows this choice */
    store('trj_langAsked', '1');
    render(null);
  });

  /* Dark mode, remembered with the main site's key */
  var themeMeta = document.querySelector('meta[name="theme-color"]:not([media])');
  function themeLabel(){
    var dark = root.getAttribute('data-theme') === 'dark';
    themeBtn.setAttribute('aria-label', dark ? t('themeToLight') : t('themeToDark'));
    themeBtn.setAttribute('title', dark ? t('themeTitleLight') : t('themeTitleDark'));
    themeBtn.setAttribute('aria-pressed', dark ? 'true' : 'false');
    if (!themeMeta){
      themeMeta = document.createElement('meta');
      themeMeta.setAttribute('name', 'theme-color');
      document.head.appendChild(themeMeta);
    }
    themeMeta.setAttribute('content', dark ? '#101c1a' : '#ffffff');
  }
  themeBtn.addEventListener('click', function(){
    var nextTheme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nextTheme);
    store('trj_theme', nextTheme);
    themeLabel();
  });
  if (window.matchMedia){
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function(e){
      var chosen = read('trj_theme');
      if (chosen !== 'dark' && chosen !== 'light'){ root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); themeLabel(); }
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  $('yr').textContent = new Date().getFullYear();
  render(null);
})();
</script>
</body>
</html>
